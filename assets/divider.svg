<svg width="1200" height="34" viewBox="0 0 1200 34" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .line { stroke: #1e2235; stroke-width: 1; }
      .tick { stroke: #c9a84c; stroke-width: 1; opacity: 0.7; }
      .pulse {
        animation: travel 4.5s linear infinite;
      }
      @keyframes travel {
        0%   { transform: translateX(-60px); opacity: 0; }
        6%   { opacity: 1; }
        94%  { opacity: 1; }
        100% { transform: translateX(1260px); opacity: 0; }
      }
    </style>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e8d08a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line class="line" x1="0" y1="17" x2="1200" y2="17"/>
  <line class="tick" x1="0" y1="10" x2="0" y2="24"/>
  <line class="tick" x1="1199" y1="10" x2="1199" y2="24"/>
  <rect class="pulse" x="0" y="15.5" width="60" height="3" fill="url(#pulseGrad)"/>
</svg>
