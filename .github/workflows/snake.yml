name: generate-snake-animation

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%23c9a84c&color_dots=%23161a2c,%231e2235,%232a3050,%237c5cbf,%23a78bfa&color_background=%2307080f
            dist/snake-light.svg?color_snake=%23a8873a&color_dots=%23f0ede0,%23e8d08a,%23c9a84c,%23a78bfa,%237c5cbf&color_background=%23ffffff

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
